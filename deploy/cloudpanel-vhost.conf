# Apenas o VHOST de imp-tec.com. Preserve os VHOSTs do Calculai/API.
# No CloudPanel: root directory = /home/imp-tec/htdocs/imp-tec.com/landing-html/public
server {
  listen 80;
  listen [::]:80;
  server_name imp-tec.com www.imp-tec.com;
  location ^~ /.well-known/acme-challenge/ {
    root /home/imp-tec/htdocs/imp-tec.com;
    default_type "text/plain";
    allow all;
    try_files $uri =404;
  }
  location / { return 301 https://imp-tec.com$request_uri; }
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name www.imp-tec.com;
  return 301 https://imp-tec.com$request_uri;
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name imp-tec.com;
  {{root}}
  {{nginx_access_log}}
  {{nginx_error_log}}
  {{settings}}
  index index.html;
  location / { try_files $uri $uri/ =404; }
  location = /api/contato.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/api/contato.php;
    fastcgi_param HTTPS on;
    fastcgi_param SERVER_PORT 443;
    fastcgi_pass 127.0.0.1:{{php_fpm_port}};
    fastcgi_read_timeout 90s;
    client_max_body_size 16k;
  }
  location ~ \.php$ { return 404; }
  location ~ /\. { deny all; }
  location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
    try_files $uri =404;
    expires 1h;
    access_log off;
  }
}
